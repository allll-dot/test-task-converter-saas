services:
  api:
    build: .
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://calls:calls@postgres:5432/calls
      APP_UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - call_audio:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calls
      POSTGRES_USER: calls
      POSTGRES_PASSWORD: calls
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calls -d calls"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  call_audio:
  postgres_data:
